<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Result Summary</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef3ff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .result-card {
      width: 620px;
      min-height: 430px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: white;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(40, 50, 100, 0.08);
    }

    /* LEFT SIDE */
    .result-left {
      margin: 0;
      padding: 34px 35px;
      color: white;
      text-align: center;
      background: linear-gradient(
        180deg,
        #683cff 0%,
        #3c2ce9 100%
      );
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .result-title {
      font-size: 20px;
      font-weight: 700;
      opacity: 0.75;
      margin-bottom: 30px;
    }

    .score-circle {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: rgba(35, 24, 190, 0.42);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
    }

    .score {
      font-size: 62px;
      line-height: 1;
      font-weight: 700;
    }

    .score-label {
      margin-top: 7px;
      font-size: 15px;
      opacity: 0.55;
    }

    .result-status {
      font-size: 27px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .result-description {
      max-width: 250px;
      font-size: 15px;
      line-height: 1.4;
      opacity: 0.75;
    }

    /* RIGHT SIDE */
    .result-right {
      padding: 34px 30px;
      display: flex;
      flex-direction: column;
    }

    .summary-title {
      color: #303a55;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .summary-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .summary-item {
      height: 46px;
      border-radius: 10px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon {
      font-size: 17px;
    }

    .reaction {
      color: #ed6b70;
      background: #fff5f5;
    }

    .memory {
      color: #1ad543;
      background: #18bad2;
    }

    .verbal {
      color: #24b494;
      background: #effbf8;
    }

    .visual {
      color: #4b5bdc;
      background: #f2f3fc;
    }

    .score-value {
      color: #303a55;
      font-weight: 700;
    }

    .score-value span {
      color: #9aa0b1;
      font-weight: 500;
    }

    .continue-btn {
      margin-top: auto;
      height: 49px;
      border: none;
      border-radius: 28px;
      background: #303b59;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .continue-btn:hover {
      background: #222c46;
      transform: translateY(-1px);
    }

    /* MOBILE */
    @media (max-width: 700px) {
      body {
        padding: 20px;
      }

      .result-card {
        width: 100%;
        max-width: 380px;
        grid-template-columns: 1fr;
        border-radius: 25px;
      }

      .result-left {
        border-radius: 25px;
        padding: 30px 20px;
      }

      .result-right {
        padding: 30px 25px;
        min-height: 350px;
      }

      .score-circle {
        width: 155px;
        height: 155px;
      }
    }
  </style>
</head>

<body>

  <div class="result-card">

    <!-- LEFT RESULT -->
    <section class="result-left">

      <h2 class="result-title">Your Result</h2>

      <div class="score-circle">
        <div class="score">76</div>
        <div class="score-label">of 100</div>
      </div>

      <h1 class="result-status">Great</h1>

      <p class="result-description">
        You scored higher than 65% of the people who have taken these tests.
      </p>

    </section>


    <!-- RIGHT SUMMARY -->
    <section class="result-right">

      <h2 class="summary-title">Summary</h2>

      <div class="summary-list">

        <div class="summary-item reaction">
          <div class="item-left">
            <span class="icon">ϟ</span>
            <span>Reaction</span>
          </div>

          <div class="score-value">
            80 <span>/ 100</span>
          </div>
        </div>


        <div class="summary-item memory">
          <div class="item-left">
            <span class="icon">◉</span>
            <span>Memory</span>
          </div>

          <div class="score-value">
            92 <span>/ 100</span>
          </div>
        </div>


        <div class="summary-item verbal">
          <div class="item-left">
            <span class="icon">▱</span>
            <span>Verbal</span>
          </div>

          <div class="score-value">
            61 <span>/ 100</span>
          </div>
        </div>


        <div class="summary-item visual">
          <div class="item-left">
            <span class="icon">◉</span>
            <span>Visual</span>
          </div>

          <div class="score-value">
            73 <span>/ 100</span>
          </div>
        </div>

      </div>


      <button class="continue-btn" onclick="continueTest()">
        Continue
      </button>

    </section>

  </div>


  <script>
    function continueTest() {
      alert("Continue button clicked!");
    }
  </script>

</body>
</html>
